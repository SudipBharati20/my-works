
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a2f1f;color:#fff;min-height:100vh}
.app{min-height:100vh;display:flex;flex-direction:column}
.nav{background:#071f15;border-bottom:2px solid #FFD700;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.nav-brand{font-family:'Oswald',sans-serif;font-size:22px;color:#FFD700;letter-spacing:1px}
.nav-right{display:flex;align-items:center;gap:12px}
.pts-badge{background:#1a3d2b;border:1px solid #FFD700;color:#FFD700;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
.btn-home{background:transparent;border:1px solid #22c55e;color:#22c55e;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif}
.btn-home:hover{background:#22c55e;color:#fff}
.main{flex:1;padding:1rem}
/* LOBBY */
.lobby-title{font-family:'Oswald',sans-serif;font-size:32px;color:#FFD700;text-align:center;margin:1.5rem 0 0.5rem}
.lobby-sub{text-align:center;color:#86efac;margin-bottom:1.5rem;font-size:14px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;max-width:900px;margin:0 auto}
.game-card{background:#1a3d2b;border:1px solid #2d5a3f;border-radius:12px;padding:1.25rem;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;gap:8px}
.game-card:hover{border-color:#FFD700;transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,215,0,0.15)}
.game-icon{font-size:32px}
.game-title{font-family:'Oswald',sans-serif;font-size:18px;color:#FFD700}
.game-desc{font-size:13px;color:#86efac;line-height:1.5}
.btn-play{margin-top:auto;background:#22c55e;color:#fff;border:none;padding:8px 0;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;font-family:'Inter',sans-serif;transition:background 0.2s}
.btn-play:hover{background:#16a34a}
/* STATS */
.stats-card{background:#1a3d2b;border:1px solid #2d5a3f;border-radius:12px;padding:1rem;max-width:900px;margin:0 auto 1.25rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat-item{text-align:center}
.stat-val{font-family:'Oswald',sans-serif;font-size:24px;color:#FFD700}
.stat-lbl{font-size:11px;color:#86efac;text-transform:uppercase;letter-spacing:0.5px}
/* GAME WRAPPER */
.game-wrap{max-width:900px;margin:0 auto}
.game-header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem}
.game-header h2{font-family:'Oswald',sans-serif;font-size:24px;color:#FFD700}
/* BUTTONS */
.btn{padding:8px 18px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;transition:all 0.15s}
.btn-green{background:#22c55e;color:#fff}.btn-green:hover{background:#16a34a}
.btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
.btn-gold{background:#FFD700;color:#1a3d2b}.btn-gold:hover{background:#eab308}
.btn-outline{background:transparent;border:1px solid #86efac;color:#86efac}.btn-outline:hover{background:#86efac;color:#071f15}
.btn:disabled{opacity:0.4;cursor:not-allowed}
/* GRID GAME */
.grid-table{width:100%;border-collapse:collapse;background:#1a3d2b;border-radius:12px;overflow:hidden}
.grid-table th,.grid-table td{border:1px solid #2d5a3f;padding:8px;text-align:center}
.grid-table th{background:#071f15;font-size:12px;color:#FFD700}
.grid-cell{cursor:pointer;min-height:60px;font-size:12px;transition:all 0.2s;background:#1a3d2b}
.grid-cell:hover{background:#2d5a3f}
.grid-cell.correct{background:#14532d;color:#86efac;cursor:default}
.grid-cell.failed{background:#450a0a;color:#fca5a5;cursor:default}
.grid-cell.active{background:#2d5a3f;outline:2px solid #FFD700}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:#1a3d2b;border:1px solid #FFD700;border-radius:12px;padding:1.5rem;width:100%;max-width:420px}
.modal h3{font-family:'Oswald',sans-serif;font-size:20px;color:#FFD700;margin-bottom:1rem}
.modal input{width:100%;background:#071f15;border:1px solid #2d5a3f;color:#fff;padding:10px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:0.75rem}
.modal input:focus{outline:none;border-color:#22c55e}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
/* QUIZ */
.quiz-opt{width:100%;text-align:left;background:#1a3d2b;border:1px solid #2d5a3f;color:#fff;padding:12px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-family:'Inter',sans-serif;transition:all 0.15s;margin-bottom:8px}
.quiz-opt:hover:not(:disabled){background:#2d5a3f;border-color:#22c55e}
.quiz-opt.correct{background:#14532d;border-color:#22c55e}
.quiz-opt.wrong{background:#450a0a;border-color:#ef4444}
.quiz-opt.reveal{background:#14532d;border-color:#22c55e}
.quiz-opt:disabled{cursor:not-allowed}
.timer-bar-wrap{height:6px;background:#071f15;border-radius:3px;margin-bottom:1rem;overflow:hidden}
.timer-bar{height:100%;background:#22c55e;border-radius:3px;transition:width 0.1s linear}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-easy{background:#14532d;color:#86efac}
.badge-med{background:#78350f;color:#fcd34d}
.badge-hard{background:#450a0a;color:#fca5a5}
.badge-cat{background:#1e3a5f;color:#93c5fd}
/* PITCH */
.pitch{background:linear-gradient(180deg,#166534 0%,#15803d 25%,#166534 50%,#15803d 75%,#166534 100%);border:2px solid #86efac;border-radius:8px;position:relative;padding:1rem;min-height:420px}
.pitch::before{content:'';position:absolute;top:50%;left:10%;right:10%;height:1px;background:rgba(255,255,255,0.3)}
.pitch::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;border:1px solid rgba(255,255,255,0.3)}
.pitch-row{display:flex;justify-content:center;gap:8px;margin:6px 0;position:relative;z-index:1}
.player-slot{width:72px;text-align:center;cursor:pointer}
.player-slot .slot-circle{width:44px;height:44px;border-radius:50%;background:#071f15;border:2px solid #2d5a3f;display:flex;align-items:center;justify-content:center;font-size:18px;margin:0 auto 3px;transition:all 0.2s}
.player-slot.filled .slot-circle{background:#1a3d2b;border-color:#22c55e}
.player-slot.captain .slot-circle{border-color:#FFD700}
.player-slot.vice .slot-circle{border-color:#93c5fd}
.player-slot .slot-name{font-size:9px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.player-slot .slot-pos{font-size:9px;color:#86efac}
.player-list{background:#071f15;border-radius:8px;overflow-y:auto;max-height:340px}
.player-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #1a3d2b;cursor:pointer;transition:background 0.1s}
.player-row:hover{background:#1a3d2b}
.player-row.selected{opacity:0.4;cursor:not-allowed}
.player-info-name{font-size:13px;font-weight:500}
.player-info-meta{font-size:11px;color:#86efac}
.player-price{font-size:12px;color:#FFD700;font-weight:600}
/* HINTS */
.hint-card{background:#071f15;border:1px solid #2d5a3f;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;animation:fadeIn 0.4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.hint-num{background:#1a3d2b;color:#FFD700;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.hint-text{font-size:13px;line-height:1.5}
/* BLUR CREST */
.crest-wrap{display:flex;justify-content:center;margin:1rem 0}
.crest-svg{transition:filter 1s}
/* CONFETTI */
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(200px) rotate(720deg);opacity:0}}
.confetti-piece{position:absolute;width:8px;height:8px;animation:confetti-fall 1.5s ease-in forwards}
/* TRANSFER */
.transfer-chain{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:1rem 0}
.transfer-club{background:#1a3d2b;border:1px solid #2d5a3f;border-radius:6px;padding:6px 10px;font-size:12px}
.transfer-club.hidden{background:#2d5a3f;border-style:dashed;color:#86efac;font-style:italic}
.transfer-arrow{color:#FFD700;font-size:14px}
/* LEADERBOARD */
.lb-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;background:#071f15;margin-bottom:6px}
.lb-rank{font-family:'Oswald',sans-serif;font-size:18px;color:#86efac;width:28px}
.lb-name{font-size:13px;font-weight:500;flex:1;margin:0 10px}
.lb-pts{font-family:'Oswald',sans-serif;font-size:16px;color:#FFD700}
.lb-row.me{border:1px solid #22c55e}
input.game-input{width:100%;background:#071f15;border:1px solid #2d5a3f;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:0.5rem}
input.game-input:focus{outline:none;border-color:#22c55e}
select.game-select{background:#071f15;border:1px solid #2d5a3f;color:#fff;padding:8px 12px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;cursor:pointer}
select.game-select:focus{outline:none;border-color:#22c55e}
.result-modal{background:#071f15;border:2px solid #FFD700;border-radius:16px;padding:2rem;text-align:center}
.result-modal h2{font-family:'Oswald',sans-serif;font-size:28px;color:#FFD700;margin-bottom:0.5rem}
.score-big{font-family:'Oswald',sans-serif;font-size:48px;color:#22c55e}
.flex{display:flex}.gap-2{gap:8px}.gap-3{gap:12px}.items-center{align-items:center}.justify-between{justify-content:space-between}.flex-wrap{flex-wrap:wrap}
.mb-1{margin-bottom:6px}.mb-2{margin-bottom:12px}.mb-3{margin-bottom:1rem}.mt-1{margin-top:6px}.mt-2{margin-top:12px}.mt-3{margin-top:1rem}
.text-gold{color:#FFD700}.text-green{color:#22c55e}.text-red{color:#ef4444}.text-muted{color:#86efac}
.text-sm{font-size:13px}.text-xs{font-size:11px}.text-lg{font-size:18px}.text-xl{font-size:22px}
.fw-bold{font-weight:700}.fw-semi{font-weight:600}
.w-full{width:100%}.text-center{text-align:center}
.p-1{padding:6px}.p-2{padding:12px}.p-3{padding:1rem}
.rounded{border-radius:8px}.rounded-lg{border-radius:12px}
.bg-dark{background:#071f15}.bg-card{background:#1a3d2b}
.border-green{border:1px solid #2d5a3f}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a3d2b;font-size:13px}
.info-row:last-child{border-bottom:none}
</style>
</head>

// ─── GRID GAME ──────────────────────────────────────────────────────────
function GridGame({addPts}){
  const[state,setState]=useState(()=>initGrid());
  const[modal,setModal]=useState(null);// {r,c}
  const[input,setInput]=useState("");
  const[msg,setMsg]=useState("");
  const[done,setDone]=useState(false);
  const[timer,setTimer]=useState(0);

  function initGrid(){
    const allClubs=[...new Set(PLAYERS_GRID.flatMap(p=>p.clubs))];
    const sc=shuffle(allClubs);
    let rows=[],cols=[];
    // pick 3 rows and 3 cols that have at least 1 valid intersection each
    let tries=0;
    while((rows.length<3||cols.length<3)&&tries<200){
      tries++;
      const r3=sc.slice(0,3);const c3=sc.slice(3,6);
      let valid=true;
      for(let r=0;r<3;r++)for(let c=0;c<3;c++){
        const ok=PLAYERS_GRID.some(p=>p.clubs.includes(r3[r])&&p.clubs.includes(c3[c]));
        if(!ok){valid=false;break}
      }
      if(valid){rows=r3;cols=c3;break}
      sc.push(sc.shift());
    }
    if(!rows.length){rows=["Barcelona","Manchester United","Chelsea"];cols=["Inter Milan","PSG","Juventus"]}
    const cells={};
    for(let r=0;r<3;r++)for(let c=0;c<3;c++)cells[`${r},${c}`]={status:"empty",answer:"",attempts:0};
    return{rows,cols,cells};
  }

  useEffect(()=>{
    if(done)return;
    const t=setInterval(()=>setTimer(p=>p+1),1000);
    return()=>clearInterval(t);
  },[done]);

  useEffect(()=>{
    const allFilled=Object.values(state.cells).every(c=>c.status!=="empty");
    if(allFilled&&!done){
      const correct=Object.values(state.cells).filter(c=>c.status==="correct").length;
      addPts(correct*10);
      setDone(true);
    }
  },[state.cells]);

  function openCell(r,c){
    const cell=state.cells[`${r},${c}`];
    if(cell.status!=="empty")return;
    setModal({r,c});setInput("");setMsg("");
  }

  function submitGuess(){
    const{r,c}=modal;
    const key=`${r},${c}`;
    const rClub=state.rows[r];const cClub=state.cols[c];
    const guess=input.trim().toLowerCase();
    const match=PLAYERS_GRID.find(p=>
      (p.name.toLowerCase().includes(guess)||guess.includes(p.name.toLowerCase().split(" ")[0].toLowerCase()))
      &&p.clubs.includes(rClub)&&p.clubs.includes(cClub)
    );
    if(match){
      setState(s=>({...s,cells:{...s.cells,[key]:{status:"correct",answer:match.name,attempts:s.cells[key].attempts+1}}}));
      setModal(null);
    } else {
      const newAttempts=state.cells[key].attempts+1;
      if(newAttempts>=3){
        const reveal=PLAYERS_GRID.find(p=>p.clubs.includes(rClub)&&p.clubs.includes(cClub));
        setState(s=>({...s,cells:{...s.cells,[key]:{status:"failed",answer:reveal?reveal.name:"—",attempts:3}}}));
        setModal(null);
      } else {
        setState(s=>({...s,cells:{...s.cells,[key]:{...s.cells[key],attempts:newAttempts}}}));
        setMsg(`❌ Wrong! ${3-newAttempts} attempt(s) left`);
      }
    }
  }

  const correct=Object.values(state.cells).filter(c=>c.status==="correct").length;
  const mins=Math.floor(timer/60);const secs=timer%60;

  return React.createElement("div",{className:"game-wrap"},
    React.createElement("div",{className:"game-header"},
      React.createElement("h2",null,"🔢 Football Grid"),
      React.createElement("span",{className:"text-muted text-sm"},`Score: ${correct}/9  |  Time: ${mins}:${String(secs).padStart(2,"0")}`),
      React.createElement("button",{className:"btn btn-outline",style:{marginLeft:"auto"},onClick:()=>{setState(initGrid());setDone(false);setTimer(0)}},`🔄 New Grid`),
    ),
    React.createElement("p",{className:"text-sm text-muted mb-2"},"Click a cell and name a player who played for BOTH clubs (row + column)."),
    React.createElement("div",{style:{overflowX:"auto"}},
      React.createElement("table",{className:"grid-table"},
        React.createElement("thead",null,
          React.createElement("tr",null,
            React.createElement("th",null,""),
            ...state.cols.map((c,i)=>React.createElement("th",{key:i},c))
          )
        ),
        React.createElement("tbody",null,
          state.rows.map((r,ri)=>React.createElement("tr",{key:ri},
            React.createElement("th",null,r),
            ...state.cols.map((_,ci)=>{
              const cell=state.cells[`${ri},${ci}`];
              return React.createElement("td",{key:ci,className:`grid-cell ${cell.status}`,onClick:()=>openCell(ri,ci)},
                cell.status==="correct"&&React.createElement("div",null,React.createElement("div",null,"✅"),React.createElement("div",{style:{fontSize:10,marginTop:2}},cell.answer)),
                cell.status==="failed"&&React.createElement("div",null,React.createElement("div",null,"❌"),React.createElement("div",{style:{fontSize:10,marginTop:2}},cell.answer)),
                cell.status==="empty"&&React.createElement("div",null,
                  React.createElement("div",{style:{fontSize:20}},"?"),
                  cell.attempts>0&&React.createElement("div",{style:{fontSize:9,color:"#fbbf24"}},`${cell.attempts}/3`)
                )
              );
            })
          ))
        )
      )
    ),
    done&&React.createElement("div",{className:"result-modal mt-3"},
      React.createElement("h2",null,"Grid Complete!"),
      React.createElement("div",{className:"score-big"},`${correct}/9`),
      React.createElement("p",{className:"text-muted mt-1"},`Time: ${mins}:${String(secs).padStart(2,"0")}  |  Points earned: ${correct*10}`),
      React.createElement("button",{className:"btn btn-green mt-2",onClick:()=>{setState(initGrid());setDone(false);setTimer(0)}},"New Grid")
    ),
    modal&&React.createElement("div",{className:"modal-overlay"},

function Dream11({addPts}){
  const[formation,setFormation]=useState("4-3-3");
  const[selected,setSelected]=useState({GK:[],DEF:[],MID:[],FWD:[]});
  const[captain,setCaptain]=useState(null);
  const[vice,setVice]=useState(null);
  const[filter,setFilter]=useState("ALL");
  const[search,setSearch]=useState("");
  const[result,setResult]=useState(null);

  const budget=100;
  const spent=Object.values(selected).flat().reduce((s,id)=>{const p=D11_PLAYERS.find(x=>x.id===id);return s+(p?p.price:0)},0);
  const remaining=budget-spent;
  const allSelected=Object.values(selected).flat();
  const fm=FORMATIONS[formation];
  const total=fm.gk+fm.def+fm.mid+fm.fwd;
  const filled=allSelected.length;

  function addPlayer(p){
    const pos=p.pos;
    const limit=fm[pos.toLowerCase()];
    if(selected[pos].length>=limit)return;
    if(allSelected.includes(p.id))return;
    if(remaining<p.price)return;
    setSelected(s=>({...s,[pos]:[...s[pos],p.id]}));
  }

  function removePlayer(pid){
    const p=D11_PLAYERS.find(x=>x.id===pid);
    setSelected(s=>({...s,[p.pos]:s[p.pos].filter(id=>id!==pid)}));
    if(captain===pid)setCaptain(null);
    if(vice===pid)setVice(null);
  }

  function calcScore(){
    const players=allSelected.map(id=>D11_PLAYERS.find(p=>p.id===id));
    let score=players.reduce((s,p)=>{
      let pts=p.rat*(p.form/10);
      if(p.id===captain)pts*=1.5;
      if(p.id===vice)pts*=1.25;
      return s+pts;
    },0);
    score=Math.round(score/players.length);
    const capP=D11_PLAYERS.find(p=>p.id===captain);
    if(capP&&capP.rat>=90)score=Math.min(100,score+10);
    const gamesEarned=Math.round(score/2);
    addPts(gamesEarned);
    setResult({score,players,gamesEarned});
  }

  function randomTeam(){
    const newSel={GK:[],DEF:[],MID:[],FWD:[]};
    const taken=new Set();
    const fill=(pos,count)=>{

      const picks=shuffle(pool).slice(0,count);

            React.createElement("button",{style:{fontSize:8,padding:"1px 3px",background:isVice?"#93c5fd":"#071f15",color:isVice?"#1a3d2b":"#93c5fd",border:"1px solid #93c5fd",borderRadius:3,cursor:"pointer"},onClick:e=>{e.stopPropagation();setVice(pid===vice?null:pid);if(captain===pid)setCaptain(null)}},"V"),

// ─── QUIZ ────────────────────────────────────────────────────────────────
function Quiz({addPts}){
  const[phase,setPhase]=useState("setup");// setup|playing|end
  const[cat,setCat]=useState("All");
  const[diff,setDiff]=useState("All");
  const[numQ,setNumQ]=useState(10);
  const[questions,setQuestions]=useState([]);
  const[qi,setQi]=useState(0);
  const[score,setScore]=useState(0);
  const[selected,setSelected]=useState(null);
  const[timerPct,setTimerPct]=useState(100);
  const[answered,setAnswered]=useState(false);
  const[lifelines,setLifelines]=useState({half:true,skip:true});
  const[eliminated,setEliminated]=useState([]);
  const[explanation,setExplanation]=useState(false);
  const timerRef=useRef(null);
  const startRef=useRef(0);

  const CATS=["All",...new Set(QUIZ_QUESTIONS.map(q=>q.cat))];
  const DIFFS=["All","Easy","Medium","Hard"];
  const TIME={Easy:15,Medium:12,Hard:10};

  function start(){
    let pool=QUIZ_QUESTIONS.filter(q=>(cat==="All"||q.cat===cat)&&(diff==="All"||q.diff===diff));
    if(pool.length<numQ)pool=[...pool,...QUIZ_QUESTIONS.filter(q=>!pool.includes(q))];
    const qs=shuffle(pool).slice(0,numQ);
    setQuestions(qs);setQi(0);setScore(0);setPhase("playing");setSelected(null);setAnswered(false);setLifelines({half:true,skip:true});setEliminated([]);
  }

  const cq=questions[qi];
  const maxTime=cq?TIME[cq.diff]||12:12;

  useEffect(()=>{
    if(phase!=="playing"||answered||!cq)return;
    startRef.current=Date.now();
    setTimerPct(100);setEliminated([]);
    timerRef.current=setInterval(()=>{
      const elapsed=(Date.now()-startRef.current)/1000;
      const pct=Math.max(0,100-(elapsed/maxTime)*100);
      setTimerPct(pct);
      if(pct<=0){
        clearInterval(timerRef.current);
        handleAnswer(-1,true);
      }
    },100);
    return()=>clearInterval(timerRef.current);
  },[qi,phase,answered]);

  function handleAnswer(idx,timedOut=false){
    if(answered)return;
    clearInterval(timerRef.current);
    setAnswered(true);setSelected(idx);setExplanation(true);
    const elapsed=(Date.now()-startRef.current)/1000;
    if(idx===cq.a){
      const base={Easy:5,Medium:10,Hard:20}[cq.diff]||5;
      const bonus=elapsed<3?5:0;
      setScore(s=>s+base+bonus);
    }
    setTimeout(()=>{
      setExplanation(false);
      const next=qi+1;
      if(next>=questions.length){
        setPhase("end");
      } else {
        setQi(next);setSelected(null);setAnswered(false);setEliminated([]);
      }
    },2000);
  }

  function useHalf(){
    if(!lifelines.half||answered)return;
    const wrongs=[0,1,2,3].filter(i=>i!==cq.a);
    const elim=shuffle(wrongs).slice(0,2);
    setEliminated(elim);
    setLifelines(l=>({...l,half:false}));
  }

  function useSkip(){
    if(!lifelines.skip||answered)return;
    setLifelines(l=>({...l,skip:false}));
    const next=qi+1;
    if(next>=questions.length){setPhase("end");}
    else{setQi(next);setSelected(null);setAnswered(false);setEliminated([]);}
  }

  function optClass(i){
    if(!answered)return"quiz-opt";
    if(i===cq.a)return"quiz-opt correct";
    if(i===selected&&i!==cq.a)return"quiz-opt wrong";
    return"quiz-opt";
  }

  if(phase==="setup")return React.createElement("div",{className:"game-wrap"},
    React.createElement("div",{className:"game-header"},React.createElement("h2",null,"🧠 Football Quiz")),
    React.createElement("div",{className:"bg-card rounded-lg p-3",style:{maxWidth:500}},
      React.createElement("p",{className:"text-sm text-muted mb-2"},"Category"),
      React.createElement("div",{className:"flex gap-2 flex-wrap mb-3"},
        CATS.map(c=>React.createElement("button",{key:c,className:`btn ${cat===c?"btn-green":"btn-outline"}`,style:{padding:"5px 12px",fontSize:12},onClick:()=>setCat(c)},c))
      ),
      React.createElement("p",{className:"text-sm text-muted mb-2"},"Difficulty"),
      React.createElement("div",{className:"flex gap-2 mb-3"},
        DIFFS.map(d=>React.createElement("button",{key:d,className:`btn ${diff===d?"btn-green":"btn-outline"}`,style:{padding:"5px 12px",fontSize:12},onClick:()=>setDiff(d)},d))
      ),
      React.createElement("p",{className:"text-sm text-muted mb-2"},"Questions"),
      React.createElement("div",{className:"flex gap-2 mb-3"},
        [5,10,15,20].map(n=>React.createElement("button",{key:n,className:`btn ${numQ===n?"btn-gold":"btn-outline"}`,style:{padding:"5px 12px",fontSize:12},onClick:()=>setNumQ(n)},n))
      ),
      React.createElement("button",{className:"btn btn-green w-full",style:{padding:"12px"},onClick:start},"🚀 Start Quiz"),
    )
  );

  if(phase==="end"){
    const pct=Math.round((score/((questions.reduce((s,q)=>s+({Easy:5,Medium:10,Hard:20}[q.diff]||5),0)||1)))*100);
    const rating=pct>=95?"Football Legend 🏆":pct>=80?"Professional ⭐":pct>=60?"Semi-Pro 💪":pct>=40?"Amateur 👍":"Beginner 🌱";
    return React.createElement("div",{className:"game-wrap"},
      React.createElement("div",{className:"result-modal"},
        React.createElement("h2",null,"Quiz Complete!"),
        React.createElement("div",{className:"score-big"},score+" pts"),
        React.createElement("p",{className:"text-gold fw-bold mt-1"},rating),
        React.createElement("p",{className:"text-muted text-sm"},`${pct}% accuracy across ${questions.length} questions`),
        React.createElement("button",{className:"btn btn-green mt-2",onClick:()=>{setPhase("setup")}},"Play Again"),
      )
    );
  }

  return React.createElement("div",{className:"game-wrap"},
    React.createElement("div",{className:"game-header"},
      React.createElement("h2",null,"🧠 Football Quiz"),
      React.createElement("span",{className:"text-sm text-muted"},`Q ${qi+1}/${questions.length}`),
      React.createElement("span",{className:"text-gold text-sm fw-semi",style:{marginLeft:"auto"}},score+" pts"),
    ),
    cq&&React.createElement("div",null,
      React.createElement("div",{className:"flex gap-2 mb-2 items-center"},
        React.createElement("span",{className:`badge badge-${cq.diff.toLowerCase()}`},cq.diff),
        React.createElement("span",{className:"badge badge-cat"},cq.cat),
        React.createElement("span",{style:{marginLeft:"auto",display:"flex",gap:6}},
          React.createElement("button",{className:`btn ${lifelines.half?"btn-outline":""}`,style:{padding:"3px 10px",fontSize:11},onClick:useHalf,disabled:!lifelines.half||answered},"50/50"),
          React.createElement("button",{className:`btn ${lifelines.skip?"btn-outline":""}`,style:{padding:"3px 10px",fontSize:11},onClick:useSkip,disabled:!lifelines.skip||answered},"Skip"),
        )
      ),
      React.createElement("div",{className:"timer-bar-wrap"},
        React.createElement("div",{className:"timer-bar",style:{width:`${timerPct}%`,background:timerPct>40?"#22c55e":timerPct>15?"#fbbf24":"#ef4444"}})
      ),
      React.createElement("p",{style:{fontSize:16,fontWeight:600,marginBottom:14,lineHeight:1.5}},cq.q),
      cq.opts.map((o,i)=>React.createElement("button",{key:i,className:optClass(i),disabled:answered||eliminated.includes(i),onClick:()=>handleAnswer(i),style:{opacity:eliminated.includes(i)?0.2:1}},
        `${["A","B","C","D"][i]}. ${o}`
      )),
      explanation&&cq&&React.createElement("div",{style:{background:"#071f15",borderRadius:8,padding:"10px 12px",marginTop:8,fontSize:13,color:"#86efac",borderLeft:"3px solid #22c55e"}},
        `💡 ${cq.exp}`
      )
    )
  );
}

// ─── TRANSFER GAME ────────────────────────────────────────────────────────
function TransferGame({addPts}){
  const[tidx,setTidx]=useState(()=>Math.floor(Math.random()*TRANSFER_CHAINS.length));
  const[attempts,setAttempts]=useState(0);
  const[input,setInput]=useState("");
  const[status,setStatus]=useState("playing");
  const[revealed,setRevealed]=useState(0);

  const chain=TRANSFER_CHAINS[tidx];
  const clubs=chain.clubs;
  const hideFrom=Math.max(clubs.length-2,0);

  function guess(){
    if(!input.trim())return;
    const g=input.trim().toLowerCase();
    const correct=chain.player.toLowerCase().split(" ").some(w=>g.includes(w)||w.includes(g))||chain.player.toLowerCase().includes(g);
    if(correct){addPts(30);setStatus("won");}
    else{
      const na=attempts+1;
      setAttempts(na);
      if(na>=3){setStatus("lost");}
      else setRevealed(r=>Math.min(r+1,2));
    }
    setInput("");
  }

  function next(){
    const ni=(tidx+1)%TRANSFER_CHAINS.length;
    setTidx(ni);setAttempts(0);setInput("");setStatus("playing");setRevealed(0);
  }

  const visibleHideFrom=hideFrom-revealed;

  return React.createElement("div",{className:"game-wrap"},
    React.createElement("div",{className:"game-header"},
      React.createElement("h2",null,"✈️ Transfer Puzzle"),
      React.createElement("span",{className:"text-sm text-muted"},`Attempt ${attempts+1}/3  •  ${chain.diff}`),
    ),
    React.createElement("p",{className:"text-sm text-muted mb-2"},"Which player followed this transfer path?"),
    React.createElement("div",{className:"transfer-chain"},
      clubs.map((c,i)=>React.createElement(React.Fragment,{key:i},
        i>0&&React.createElement("span",{className:"transfer-arrow"},"→"),
        React.createElement("div",{className:`transfer-club ${i>=visibleHideFrom&&status==="playing"?"hidden":""}`},
          i>=visibleHideFrom&&status==="playing"?`??? (${c.y})`:React.createElement("span",null,React.createElement("strong",null,c.c),React.createElement("span",{style:{fontSize:10,color:"#86efac",marginLeft:4}},c.y))
        )
      ))
    ),
    status==="playing"&&React.createElement("div",{className:"mt-2"},
      React.createElement("input",{className:"game-input",value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&guess(),placeholder:"Name the player...",autoFocus:true}),
      React.createElement("button",{className:"btn btn-green",onClick:guess},"Submit"),
    ),
    status==="won"&&React.createElement("div",{className:"result-modal"},
      React.createElement("h2",null,"✅ Correct!"),
      React.createElement("div",{className:"score-big"},"+30 pts"),
      React.createElement("p",{className:"text-gold fw-bold mt-1"},chain.player),
      React.createElement("button",{className:"btn btn-green mt-2",onClick:next},"Next Puzzle →"),
    ),
    status==="lost"&&React.createElement("div",{className:"result-modal"},
      React.createElement("h2",{style:{color:"#ef4444"}},"❌ The answer was:"),
      React.createElement("p",{className:"text-gold text-xl fw-bold"},chain.player),
      React.createElement("button",{className:"btn btn-green mt-2",onClick:next},"Next Puzzle →"),
    ),
  );
}

root.render(React.createElement(App));
